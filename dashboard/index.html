<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowPowPow — Useful-Compute Crypto Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0f; color: #e0e0e0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 0; }
        h1 { font-size: 2.5rem; color: #fff; }
        h1 span { color: #00ff88; }
        .subtitle { color: #888; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #12121a; border-radius: 12px; padding: 20px; border: 1px solid #222; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .coin-name { font-size: 1.2rem; font-weight: 600; }
        .coin-type { font-size: 0.8rem; color: #666; background: #1a1a2a; padding: 4px 8px; border-radius: 4px; }
        .price { font-size: 1.8rem; font-weight: 700; margin: 10px 0; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat { background: #1a1a2a; padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.75rem; color: #888; }
        .stat-value { font-size: 1rem; font-weight: 600; margin-top: 4px; }
        .bullish { color: #00ff88; }
        .bearish { color: #ff4444; }
        .neutral { color: #888; }
        .signal { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .signal.bullish { background: #00ff8822; color: #00ff88; }
        .signal.bearish { background: #ff444422; color: #ff4444; }
        .signal.neutral { background: #88888822; color: #888; }
        .status { text-align: center; padding: 20px; color: #666; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pow<span>Pow</span>Pow</h1>
            <p class="subtitle">Data infrastructure for useful-compute crypto</p>
        </header>
        
        <div id="dashboard" class="grid">
            <div class="loading">Loading...</div>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        const API = 'http://localhost:5000/api/v1';
        
        async function fetchPredictions() {
            try {
                const res = await fetch(`${API}/predictions`);
                const data = await res.json();
                renderDashboard(data);
            } catch (e) {
                document.getElementById('dashboard').innerHTML = '<div class="loading">API not connected. Start with: python3 api/app.py</div>';
            }
        }
        
        function renderDashboard(predictions) {
            const grid = document.getElementById('dashboard');
            grid.innerHTML = '';
            
            const coins = {
                'QUBIC': { name: 'Qubic', type: 'AI Compute' },
                'PRL': { name: 'Pearl', type: 'Useful PoW' },
                'NOCK': { name: 'Nockchain', type: 'ZK-PoW' },
                'XMR': { name: 'Monero', type: 'Privacy' },
                'GNK': { name: 'Gonka', type: 'Compute Market' },
                'TSC': { name: 'TensorCash', type: 'AI Inference' },
                'XEL': { name: 'Xelis', type: 'BlockDAG' },
                'XTM': { name: 'Tari', type: 'Mimblewimble' },
                'NPT': { name: 'Neptune', type: 'Private STARKs' },
                'QTC': { name: 'Qubitcoin', type: 'Quantum Sim' },
            };
            
            predictions.forEach(p => {
                const info = coins[p.symbol] || { name: p.symbol, type: 'Unknown' };
                const imbalanceClass = p.imbalance > 0.1 ? 'bullish' : p.imbalance < -0.1 ? 'bearish' : 'neutral';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="coin-name">${info.name}</span>
                        <span class="coin-type">${info.type}</span>
                    </div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-label">Bid Volume</div>
                            <div class="stat-value">${formatNum(p.bid_volume)}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Ask Volume</div>
                            <div class="stat-value">${formatNum(p.ask_volume)}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Imbalance</div>
                            <div class="stat-value ${imbalanceClass}">${(p.imbalance * 100).toFixed(1)}%</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Signal</div>
                            <div class="signal ${p.signal.toLowerCase()}">${p.signal}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            document.getElementById('status').textContent = `Tracking ${predictions.length} coins • Updated ${new Date().toLocaleTimeString()}`;
        }
        
        function formatNum(n) {
            if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toFixed(0);
        }
        
        fetchPredictions();
        setInterval(fetchPredictions, 30000);
    </script>
</body>
</html>
