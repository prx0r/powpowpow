[project]
name = "powpowpow"
version = "0.3.0"
description = "Provenance-preserving historical model of compute resource economics"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.30",
    "flask>=3.0",
    "websockets>=15",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pandas>=2.0",
    "mcp>=1,<2",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
